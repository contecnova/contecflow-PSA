# ══════════════════════════════════════════════════════════════════════════════
# Contecflow PSA — nginx: sirve el frontend y hace de proxy inverso a la API
#
# Auditoría 2026-08 (hallazgo 12). Antes este fichero servía SÓLO los estáticos,
# sin ninguna directiva `proxy_pass`, mientras el backend escuchaba dentro de su
# propio contenedor. El navegador cargaba la aplicación y ninguna llamada a la
# API llegaba a destino: el despliegue no podía funcionar.
#
# Que la API salga por el MISMO origen que el frontend tiene tres consecuencias
# buenas, y por eso es la forma correcta y no un atajo:
#   · CORS deja de intervenir: no hay petición entre orígenes distintos.
#   · Las cookies httpOnly de sesión viajan sin necesidad de SameSite=None,
#     que obliga a Secure y abre el hueco de terceros.
#   · La comprobación de Origin/Referer del middleware CSRF encaja de forma
#     natural, porque el origen del navegador y el de la API coinciden.
# ══════════════════════════════════════════════════════════════════════════════

# El backend vive en la red interna de compose. `resolver` no hace falta porque
# el nombre se resuelve al arrancar y el servicio tiene `restart: unless-stopped`.
upstream contecflow_api {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Tope de cuerpo de petición. Sin esta directiva nginx aplica su defecto de
    # 1 MB y rechazaría con 413 cualquier subida legítima; sin un tope explícito,
    # el backend recibiría cuerpos arbitrariamente grandes antes de poder
    # rechazarlos. Debe ir por encima de MAX_FILE_SIZE_MB (100 por defecto) con
    # margen para el sobrecoste de multipart.
    client_max_body_size 110m;

    # No revelar la versión de nginx en las respuestas ni en las páginas de error.
    server_tokens off;

    # Compresión de las respuestas de texto. Los .js y .css del bundle son la
    # mayor parte del peso de la primera carga.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/xml+rss text/javascript image/svg+xml;

    # ── Cabeceras de seguridad ────────────────────────────────────────────────
    # `connect-src 'self'` es suficiente porque la API sale por este mismo
    # origen a través del proxy de abajo. Si algún día la API se separa de
    # dominio, hay que añadirla aquí explícitamente.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' wss: ws:; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # HSTS: sólo tiene sentido cuando la conexión ya es HTTPS. Activarlo sobre
    # HTTP no aporta nada y puede dejar inaccesible el sitio si el TLS aún no
    # está listo. `always` no basta: la cabecera debe emitirse tras terminar TLS
    # en el balanceador de delante, o descomentarla aquí cuando este nginx
    # termine el TLS directamente.
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Página de indicadores para un iframe (Teams, SharePoint…) ─────────────
    # La API trae su propio `frame-ancestors` (BI_EMBED_FRAME_ANCESTORS y la
    # configuración de la empresa). Con un `add_header` aquí no se heredan los
    # del servidor, que la prohibirían en cualquier iframe (X-Frame-Options DENY).
    location = /api/v1/bi/embed/view {
        proxy_pass http://contecflow_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ── API ───────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://contecflow_api;
        proxy_http_version 1.1;

        # Estas cuatro son las que permiten al backend saber quién llama de
        # verdad. Sin ellas, el rate limiting por IP contaría todas las
        # peticiones como procedentes de nginx y un solo cliente agotaría la
        # cuota de todos.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Sin buffering de la respuesta: hay endpoints que devuelven ficheros
        # generados al vuelo (informes, PDF) y bufferearlos añade latencia y
        # consumo de disco en nginx sin ninguna ventaja.
        proxy_buffering off;
        proxy_request_buffering off;

        # Márgenes amplios: la generación de informes y el análisis con IA
        # superan con holgura el defecto de 60 s.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # ── WebSocket ─────────────────────────────────────────────────────────────
    # Todos los WebSocket de la API. Sin las cabeceras de Upgrade, nginx cierra
    # la conexión al negociar y la pantalla queda en reconexión perpetua sin
    # decir por qué. Revisión 2026-11: antes sólo pasaba `/api/v1/ws/`, y la
    # colaboración, el tiempo real de BI y los paneles compartidos se quedaban
    # fuera. `tests/test_nginx_websockets_2026_11.py` comprueba contra la tabla
    # de rutas que cada WebSocket encaja aquí.
    location ~ ^/api/v1/(ws/|collaboration/ws$|bi/intelligence/realtime/stream$|bi/collaboration/dashboards/[^/]+/updates$) {
        proxy_pass http://contecflow_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Una conexión de WebSocket está inactiva por naturaleza entre mensajes.
        # Con el defecto de 60 s, nginx la cortaría en cada silencio.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ── Rutas de la API fuera de /api ─────────────────────────────────────────
    # La preparación (`/ready`), la página de estado pública y su widget para
    # webs de clientes. Revisión 2026-11: caían en `location /` y devolvían el
    # index.html de la SPA. Con `add_header` propio no heredan la CSP y el
    # `X-Frame-Options` del servidor: los trae la API (y el widget necesita
    # poder cargarse desde otro origen).
    location ~ ^/(ready|status|status/page\.js|status/embed\.js|widget/ticket\.js)$ {
        proxy_pass http://contecflow_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── Sonda de salud ────────────────────────────────────────────────────────
    # Se expone para que un balanceador de delante pueda comprobar el conjunto
    # (nginx + API) con una sola petición. Sin log para no llenar el fichero.
    location = /health {
        proxy_pass http://contecflow_api/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Estáticos con huella de contenido ─────────────────────────────────────
    # Vite añade un hash al nombre de cada fichero, así que el contenido de una
    # URL nunca cambia: `immutable` evita que el navegador revalide.
    location ~* \.(?:js|css|woff2|woff|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # ── El index NO se cachea ─────────────────────────────────────────────────
    # Es el único fichero sin hash en el nombre. Si se cachea, un despliegue
    # nuevo sigue sirviendo el index viejo, que referencia bundles que ya no
    # existen: la aplicación queda en blanco hasta que el usuario fuerza recarga.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires 0;
    }

    # ── Fallback de la SPA ────────────────────────────────────────────────────
    # Va al final para no capturar /api/ ni los estáticos.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

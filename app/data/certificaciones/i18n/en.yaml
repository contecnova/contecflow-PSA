Lista de software autorizado: List of authorised software
Registro de instalaciones: Installation log
Política de control de acceso: Access control policy
El acceso a la información y los sistemas se concede por necesidad de conocer y mínimo privilegio, según reglas escritas.: Access to information and systems is granted on a need-to-know and least-privilege basis, under written rules.
Modelo de roles: Role model
Ciclo de vida de identidades: Identity lifecycle
? Cada identidad es única, tiene responsable y se gestiona desde el alta hasta la baja; las cuentas compartidas son excepción justificada.
: Each identity is unique, has an owner and is managed from creation to removal; shared accounts are a justified exception.
Procedimiento de identidades: Identity procedure
Listado de cuentas con responsable: List of accounts with owner
Gestión de credenciales y contraseñas: Credential and password management

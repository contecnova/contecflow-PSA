Plazos de entrega medidos: Measured delivery times
Guías de seguridad para el usuario del producto: Product user security guides
El producto incluye guías de defensa en profundidad, bastionado y entorno esperado, revisadas en cada versión.: The product includes guides on defence in depth, hardening and the expected environment, reviewed at each release.

Informes post-incidente: Post-incident reports
Acciones de mejora derivadas: Resulting improvement actions
Recogida y custodia de evidencias: Collection and custody of evidence
Las evidencias de incidentes se recogen y custodian de forma que conserven su valor probatorio.: Incident evidence is collected and held in a way that preserves its evidential value.
Procedimiento forense: Forensic procedure
Registros de cadena de custodia: Chain of custody records
Comunicación de eventos por el personal: Reporting of events by staff
Cualquier persona puede comunicar sin demora eventos de seguridad por canales conocidos y sencillos.: Anyone can report security events without delay through well-known and simple channels.
Canal de comunicación publicado: Published reporting channel
Estadística de comunicaciones recibidas: Statistics of reports received
Notificación de incidentes significativos: Notification of significant incidents
? Los incidentes con impacto significativo en los servicios se notifican sin demora indebida al CSIRT o a la autoridad competente, siguiendo un flujo con responsables.
: Incidents with a significant impact on services are notified without undue delay to the CSIRT or the competent authority, following a workflow with named owners.
Flujo de notificación aprobado: Approved notification workflow
Registro de notificaciones enviadas: Record of notifications sent
Alerta temprana en 24 horas: Early warning within 24 hours
? En las 24 horas siguientes a tener conocimiento de un incidente significativo se envía una alerta temprana indicando si se sospecha de un acto ilícito o de efecto transfronterizo.
: Within 24 hours of becoming aware of a significant incident, an early warning is sent indicating whether an unlawful act or a cross-border effect is suspected.
Alertas tempranas con sello de tiempo: Time-stamped early warnings
Medición del plazo: Measurement of the deadline
Notificación del incidente en 72 horas: Incident notification within 72 hours

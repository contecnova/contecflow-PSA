? Ciberseguridad de sistemas de automatización y control industrial. Cada parte es un nivel; el nivel de seguridad objetivo (SL-T) se fija por zona en el programa.
: Cybersecurity of industrial automation and control systems. Each part is a level; the target security level (SL-T) is set per zone in the programme.
Programa de seguridad del propietario del activo: Asset owner security programme
Evaluación de riesgos y diseño de zonas y conductos: Risk assessment and design of zones and conduits
Requisitos de seguridad del sistema y niveles de seguridad: System security requirements and security levels
Ciclo de vida de desarrollo seguro del producto: Secure product development lifecycle
Requisitos técnicos de seguridad de componentes: Technical security requirements for components
Contexto de la organización y partes interesadas: Context of the organisation and interested parties
? Se identifican las cuestiones internas y externas y las expectativas de las partes interesadas que condicionan la seguridad, y se revisan al menos una vez al año.
: Internal and external issues and the expectations of interested parties that affect security are identified and reviewed at least once a year.
Análisis de contexto aprobado: Approved context analysis
Registro de partes interesadas y requisitos: Register of interested parties and requirements
Alcance del sistema de gestión: Scope of the management system
? El alcance (entidades, sedes, procesos, sistemas, plantas OT y servicios) está definido, justificado y aprobado, con sus exclusiones motivadas.
: The scope (entities, sites, processes, systems, OT plants and services) is defined, justified and approved, with any exclusions duly reasoned.
Documento de alcance aprobado: Approved scope document
Mapa de sedes y entidades incluidas: Map of included sites and entities
Objetivos de seguridad medibles: Measurable security objectives
? Hay objetivos de seguridad medibles, con responsable, plazo y recursos, alineados con la política y revisados periódicamente.
: Measurable security objectives exist, with an owner, deadline and resources, aligned with the policy and reviewed periodically.
Cuadro de objetivos e indicadores: Table of objectives and indicators
Actas de seguimiento: Follow-up minutes
Recursos y competencia del personal clave: Resources and competence of key personnel
? Se asignan recursos suficientes y se asegura y documenta la competencia de quienes tienen funciones de seguridad o desarrollo seguro.
: Sufficient resources are allocated, and the competence of those with security or secure development roles is ensured and documented.
Matriz de competencias: Competence matrix
Certificados y planes de formación: Certificates and training plans
Control de la información documentada: Control of documented information
Las políticas, procedimientos y registros se crean, aprueban, versionan, distribuyen y conservan con un flujo controlado.: Policies, procedures and records are created, approved, versioned, distributed and retained through a controlled workflow.
Listado maestro de documentos: Master list of documents
Historial de versiones y aprobaciones: Version and approval history
Seguimiento, medición y eficacia de las medidas: Monitoring, measurement and effectiveness of measures
Se define qué se mide, cómo y cuándo, y se analizan los resultados para evaluar la eficacia de las medidas de seguridad.: What is measured, how and when is defined, and the results are analysed to assess the effectiveness of security measures.
Cuadro de mando de indicadores: Indicator dashboard
Informe periódico de eficacia: Periodic effectiveness report
Programa de auditoría interna: Internal audit programme
? Se planifica y ejecuta un programa de auditorías internas independientes que cubre todo el alcance y los requisitos de cada norma.
: A programme of independent internal audits is planned and carried out, covering the whole scope and the requirements of each standard.
Programa anual de auditoría: Annual audit programme
Informes de auditoría interna: Internal audit reports
Revisión por la dirección: Management review
? La dirección revisa a intervalos planificados el desempeño del sistema, los riesgos, los hallazgos y las oportunidades de mejora, y deja constancia de sus decisiones.
: Management reviews at planned intervals the performance of the system, risks, findings and opportunities for improvement, and records its decisions.
Acta de revisión por la dirección: Management review minutes
Plan de acciones derivado: Resulting action plan
No conformidades y acciones correctivas: Nonconformities and corrective actions
? Cada no conformidad se registra, se analiza su causa, se corrige con plan y responsable y se verifica la eficacia antes del cierre.
: Each nonconformity is recorded, its cause is analysed, it is corrected with a plan and an owner, and effectiveness is verified before closure.
Registro de hallazgos y CAPA: Register of findings and CAPA
Verificaciones de eficacia: Effectiveness checks
Mejora continua: Continuous improvement
? Se identifican y priorizan mejoras del sistema de gestión y del proceso de desarrollo a partir de indicadores, auditorías e incidentes.
: Improvements to the management system and the development process are identified and prioritised on the basis of indicators, audits and incidents.
Registro de mejoras: Register of improvements
Lecciones aprendidas incorporadas: Lessons learned incorporated
Política de seguridad y políticas temáticas: Security policy and topic-specific policies
? La dirección aprueba una política de seguridad y las políticas temáticas necesarias, las comunica y las revisa cuando hay cambios relevantes.
: Management approves a security policy and the necessary topic-specific policies, communicates them and reviews them when relevant changes occur.
Política aprobada y firmada: Approved and signed policy
Evidencia de comunicación: Evidence of communication
Funciones y responsabilidades de seguridad: Security roles and responsibilities
? Las funciones de seguridad están definidas y asignadas, incluido un responsable de seguridad con autoridad y acceso a la dirección.
: Security roles are defined and assigned, including a Security Officer with authority and access to management.
Organigrama de seguridad: Security organisation chart
Nombramientos firmados: Signed appointments
Segregación de funciones: Segregation of duties
? Las funciones incompatibles se separan o, si no es posible, se compensan con controles de supervisión; los conflictos se detectan y se revisan.
: Incompatible duties are separated or, where that is not possible, compensated by supervisory controls; conflicts are detected and reviewed.
Matriz de incompatibilidades (SoD): Incompatibility matrix (SoD)
Informe de conflictos y compensaciones: Report of conflicts and compensations
Compromiso y responsabilidad de la dirección: Management commitment and accountability
? La dirección aprueba las medidas de gestión de riesgos, supervisa su aplicación y responde de su cumplimiento; exige a todo el personal que aplique las políticas.
: Management approves risk management measures, oversees their implementation and is accountable for compliance; it requires all staff to apply the policies.
Acta de aprobación de medidas por el órgano de dirección: Minutes of approval of measures by the management body
Informes de supervisión periódicos: Periodic oversight reports
Formación en ciberseguridad del órgano de dirección: Cybersecurity training for the management body
? Los miembros del órgano de dirección reciben formación periódica para identificar riesgos y valorar las prácticas de gestión de ciberseguridad.
: Members of the management body receive regular training to identify risks and assess cybersecurity management practices.
Registro de asistencia de la dirección: Management attendance record
Contenido de la formación: Training content
Relación con autoridades: Contact with authorities
Se mantienen los contactos con autoridades competentes, CSIRT y fuerzas de seguridad, con quién comunica qué y cuándo.: Contacts are maintained with competent authorities, CSIRTs and law enforcement, with who communicates what and when.
Directorio de autoridades y CSIRT: Directory of authorities and CSIRTs
Registro de comunicaciones: Record of communications
Relación con grupos especializados: Contact with special interest groups
La organización participa en foros, asociaciones sectoriales y redes de intercambio de información de seguridad.: The organisation takes part in forums, industry associations and security information-sharing networks.
Membresías y suscripciones: Memberships and subscriptions
Boletines recibidos: Bulletins received
Inteligencia de amenazas: Threat intelligence
Se recoge y analiza información sobre amenazas relevantes para el sector y los activos, y se usa para ajustar controles.: Information on threats relevant to the sector and the assets is collected and analysed, and used to adjust controls.
Informes de inteligencia: Intelligence reports
Acciones derivadas: Resulting actions
Seguridad en la gestión de proyectos: Security in project management
Todo proyecto evalúa sus riesgos de seguridad desde el inicio e incorpora los requisitos de seguridad en su plan.: Every project assesses its security risks from the outset and incorporates security requirements into its plan.
Plantilla de proyecto con apartado de seguridad: Project template with a security section
Evaluaciones de riesgo de proyectos: Project risk assessments
Evaluación de riesgos de seguridad: Security risk assessment
? Se aplica una metodología repetible para identificar, analizar y valorar los riesgos de seguridad, con propietarios y criterios de aceptación aprobados.
: A repeatable methodology is applied to identify, analyse and evaluate security risks, with owners and approved acceptance criteria.
Metodología de riesgos aprobada: Approved risk methodology
Registro de riesgos actualizado: Updated risk register
Tratamiento de riesgos y declaración de aplicabilidad: Risk treatment and Statement of Applicability
? Se eligen las opciones de tratamiento, se comparan con la biblioteca de controles y se justifica en la declaración de aplicabilidad qué aplica y qué no.
: Treatment options are chosen and compared against the control library, and the Statement of Applicability justifies what applies and what does not.
Plan de tratamiento aprobado: Approved treatment plan
Declaración de aplicabilidad firmada: Signed Statement of Applicability
Planificación operacional y de cambios en el sistema: Operational planning and changes to the system
Los procesos del sistema de gestión y sus cambios se planifican y controlan, incluidos los subcontratados.: The management system processes and their changes are planned and controlled, including outsourced ones.
Plan operativo anual: Annual operating plan
Registro de cambios del sistema de gestión: Management system change log
Comunicación interna y externa sobre seguridad: Internal and external communication on security
Se define qué se comunica sobre seguridad, a quién, cuándo y por qué canal.: It is defined what is communicated about security, to whom, when and through which channel.
Plan de comunicación: Communication plan
'Alcance de la evaluación: cuentas, procesos y sistemas significativos': 'Assessment scope: significant accounts, processes and systems'
? Se determinan con criterios cuantitativos y cualitativos las entidades, cuentas, procesos y aplicaciones dentro del alcance de la evaluación del control interno.
: The entities, accounts, processes and applications within the scope of the internal control assessment are determined using quantitative and qualitative criteria.
Análisis de materialidad y alcance: Materiality and scoping analysis
Listado de procesos y aplicaciones en alcance: List of processes and applications in scope
Inventario de activos de información: Information asset inventory
Existe un inventario actualizado de información, sistemas, componentes OT y servicios, con propietario y criticidad.: An up-to-date inventory of information, systems, OT components and services exists, with owner and criticality.
Extracto de la CMDB: CMDB extract
Revisión periódica del inventario: Periodic review of the inventory
Uso aceptable de la información y los activos: Acceptable use of information and assets
Las normas de uso de la información y los activos están escritas, se comunican y se aceptan expresamente.: The rules for use of information and assets are written down, communicated and expressly accepted.
Normas de uso aceptadas: Accepted rules of use
Registro de aceptación: Acceptance record
Devolución de activos: Return of assets

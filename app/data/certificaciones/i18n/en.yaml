Campañas de recertificación cerradas: Closed recertification campaigns
Correcciones aplicadas: Corrections applied
Accesos privilegiados: Privileged access
Los privilegios elevados se limitan, se conceden de forma temporal y justificada y su uso queda registrado y revisado.: Elevated privileges are limited, granted temporarily and with justification, and their use is recorded and reviewed.
Inventario de cuentas privilegiadas: Inventory of privileged accounts
Revisión del registro de actividad privilegiada: Review of the privileged activity log
Autorización y restricción del acceso: Authorisation and restriction of access
Los sistemas aplican las autorizaciones definidas a cada usuario, proceso o dispositivo y bloquean lo no autorizado.: Systems enforce the defined authorisations for each user, process or device and block what is not authorised.
Configuración de permisos: Permissions configuration
Pruebas de autorización: Authorisation tests
Acceso directo a datos y bases de datos financieras: Direct access to data and financial databases
El acceso directo a bases de datos y tablas con información financiera se restringe a perfiles autorizados y se supervisa.: Direct access to databases and tables holding financial information is restricted to authorised profiles and monitored.
Listado de accesos directos: List of direct accesses
Revisión del registro de consultas y cambios: Review of the query and change log
Cuentas de servicio, genéricas y de dispositivos: Service, generic and device accounts
? Los procesos de software y los dispositivos se identifican y autentican; las cuentas de servicio y genéricas tienen responsable y uso restringido.
: Software processes and devices are identified and authenticated; service and generic accounts have an owner and restricted use.
Inventario de cuentas de servicio: Inventory of service accounts
Rotación de secretos documentada: Documented rotation of secrets
Autenticación robusta y multifactor: Strong and multi-factor authentication
? La autenticación es proporcional al riesgo, con multifactor para accesos remotos y privilegiados, bloqueo tras intentos fallidos y sin revelar información en el proceso.
: Authentication is proportionate to risk, with multi-factor for remote and privileged access, lockout after failed attempts and no disclosure of information in the process.
Informe de cobertura MFA: MFA coverage report
Configuración de bloqueo: Lockout configuration
Control de sesiones: Session control
? Las sesiones se bloquean por inactividad, pueden terminarse en remoto y se limita la concurrencia cuando el riesgo lo exige.
: Sessions are locked after inactivity, can be terminated remotely, and concurrency is limited where risk requires it.
Configuración de sesiones: Session configuration
Prueba de bloqueo y cierre: Lock and logout test
Aviso de uso del sistema: System use notification
Antes de acceder, el sistema muestra un aviso configurable sobre su uso autorizado.: Before access, the system displays a configurable notice about authorised use.
Captura del aviso de acceso: Capture of the access notice
Acceso desde redes no confiables: Access from untrusted networks
? El acceso desde redes no confiables (incluido el remoto a planta) se controla, se autentica con fuerza y se aprueba explícitamente.
: Access from untrusted networks (including remote access to the plant) is controlled, strongly authenticated and explicitly approved.
Arquitectura de acceso remoto: Remote access architecture
Registro de sesiones remotas aprobadas: Record of approved remote sessions
Control del acceso inalámbrico: Wireless access control
Las redes inalámbricas se autorizan, autentican y supervisan, y su uso se restringe según la zona.: Wireless networks are authorised, authenticated and monitored, and their use is restricted according to the zone.
Inventario de redes inalámbricas: Inventory of wireless networks
Configuración de autenticación: Authentication configuration
Certificados y autenticación por clave pública: Certificates and public-key authentication

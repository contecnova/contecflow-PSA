? El consejero delegado y el director financiero certifican los informes periódicos y la eficacia de los controles de divulgación, apoyados en subcertificaciones.
: The chief executive officer and chief financial officer certify the periodic reports and the effectiveness of disclosure controls, supported by sub-certifications.

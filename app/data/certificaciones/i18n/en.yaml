: Information security assessment for the automotive sector (ENX). AL2 and AL3 assess the same information security requirements at different depth; the prototypes module requires AL3.
NIS2 — Directiva (UE) 2022/2555: NIS2 — Directive (EU) 2022/2555
2022/2555: 2022/2555
? 'Directiva de ciberseguridad de la UE para entidades esenciales e importantes. No es certificable: se demuestra ante la autoridad.'
: 'EU cybersecurity directive for essential and important entities. It is not certifiable: compliance is demonstrated to the authority.'
Ley Sarbanes-Oxley (SOX): Sarbanes-Oxley Act (SOX)
2002 (secciones 302, 404, 802 y 906): 2002 (sections 302, 404, 802 and 906)
? Control interno sobre la información financiera de sociedades cotizadas en EE. UU. Los códigos ITGC/FC/ELC/ITAC son un catálogo de referencia propio; los de sección son de la ley.
: Internal control over financial reporting for US-listed companies. The ITGC/FC/ELC/ITAC codes are our own reference catalogue; the section codes are from the Act.
J-SOX (Ley de Instrumentos Financieros y Mercados de Japón): J-SOX (Japan Financial Instruments and Exchange Act)
Normas de evaluación y auditoría revisadas en 2023 (vigentes desde el ejercicio 2024): Assessment and audit standards revised in 2023 (in force from fiscal year 2024)

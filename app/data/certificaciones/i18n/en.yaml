: Certificates and public keys are issued, validated, renewed and revoked in a controlled way; key-based authentication is sufficiently strong.
Inventario de certificados: Certificate inventory
Procedimiento de renovación y revocación: Renewal and revocation procedure
No repudio de acciones: Non-repudiation of actions
Las acciones relevantes quedan atribuidas de forma inequívoca a quien las realizó.: Relevant actions are unequivocally attributed to whoever performed them.
Registro de auditoría con usuario: Audit log with user
Firma de aprobaciones: Signing of approvals
Acceso al código fuente: Access to source code
El código fuente, las herramientas y las bibliotecas de desarrollo tienen acceso restringido y registrado.: Source code, tools and development libraries have restricted and logged access.
Permisos del repositorio: Repository permissions
Revisión de accesos al repositorio: Review of repository access
Seguridad en la relación con proveedores: Security in supplier relationships
? Se identifican los proveedores con impacto en la seguridad, se evalúan antes de contratarlos y se gestionan sus riesgos durante toda la relación.
: Suppliers with an impact on security are identified, assessed before engagement and their risks managed throughout the relationship.
Registro de proveedores con criticidad: Supplier register with criticality
Evaluaciones de seguridad: Security assessments
Requisitos de seguridad en contratos: Security requirements in contracts
? Los contratos con proveedores incluyen requisitos de seguridad, confidencialidad, notificación de incidentes, auditoría y salida.
: Supplier contracts include requirements on security, confidentiality, incident notification, audit and exit.
Cláusulas tipo de seguridad: Standard security clauses
Contratos firmados con anexo de seguridad: Signed contracts with security annex
Seguridad de la cadena de suministro TIC: ICT supply chain security
? Se valoran las vulnerabilidades y prácticas de desarrollo de cada proveedor directo y de los componentes de terceros incorporados.
: The vulnerabilities and development practices of each direct supplier and of the third-party components incorporated are assessed.
Evaluación de proveedores TIC críticos: Assessment of critical ICT suppliers
Análisis de componentes de terceros: Analysis of third-party components
Seguimiento de servicios de proveedores e informes de aseguramiento: Monitoring of supplier services and assurance reports
? El servicio de los proveedores se supervisa, se revisan sus informes de aseguramiento (SOC 1/SOC 2, etiquetas TISAX) y se gestionan sus cambios.
: Supplier service is monitored, their assurance reports (SOC 1/SOC 2, TISAX labels) are reviewed and their changes are managed.
Revisiones periódicas de proveedores: Periodic supplier reviews
Informes SOC revisados con controles complementarios: SOC reports reviewed with complementary controls
Desarrollo externalizado: Outsourced development
El desarrollo encargado a terceros se dirige, supervisa y verifica con los mismos requisitos de seguridad que el propio.: Development commissioned from third parties is directed, supervised and verified against the same security requirements as in-house development.
Requisitos de seguridad en el encargo: Security requirements in the commission
Revisiones de entregas del tercero: Reviews of third-party deliverables
Preparación para la gestión de incidentes: Incident management readiness
Hay un proceso de gestión de incidentes con funciones, canales, clasificación y escalado, probado periódicamente.: An incident management process exists with roles, channels, classification and escalation, tested periodically.
Procedimiento de incidentes: Incident procedure
Informe de simulacro: Exercise report
Evaluación y clasificación de eventos: Event assessment and classification
? Los eventos se evalúan con criterios definidos para decidir si son incidentes y si son significativos a efectos regulatorios.
: Events are assessed against defined criteria to decide whether they are incidents and whether they are significant for regulatory purposes.
Criterios de clasificación: Classification criteria
Registro de decisiones de clasificación: Record of classification decisions
Respuesta a incidentes: Incident response
Los incidentes se contienen, erradican y recuperan según procedimientos, con coordinación de las partes implicadas.: Incidents are contained, eradicated and recovered from according to procedures, with coordination of the parties involved.
Tickets de incidentes con cronología: Incident tickets with timeline
Informes de cierre: Closure reports
Aprendizaje de los incidentes: Learning from incidents

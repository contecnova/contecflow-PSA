Actualizaciones de seguridad del producto: Product security updates
? Las actualizaciones de seguridad se cualifican, documentan, entregan de forma verificable y a tiempo, incluidas las de componentes dependientes.
: Security updates are qualified, documented and delivered in a verifiable and timely way, including those for dependent components.

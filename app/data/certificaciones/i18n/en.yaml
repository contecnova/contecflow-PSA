Normas de transferencia: Transfer rules
Acuerdos de intercambio firmados: Signed transfer agreements
Uso seguro de servicios en la nube y externos: Secure use of cloud and external services
? Los servicios de TI externos y en la nube se evalúan, aprueban, gestionan y abandonan según criterios de seguridad definidos.
: External IT and cloud services are assessed, approved, managed and exited according to defined security criteria.
Registro de servicios externos aprobados: Register of approved external services
Evaluaciones de seguridad del servicio: Service security assessments
Software autorizado en sistemas operativos: Authorised software on operating systems

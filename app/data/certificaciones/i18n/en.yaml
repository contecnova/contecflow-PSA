Lista de comprobación de salida: Exit checklist
Acta de devolución: Return record
Clasificación de la información: Classification of information
? La información se clasifica por confidencialidad, integridad y disponibilidad según un esquema único y se protege conforme a su clase.
: Information is classified by confidentiality, integrity and availability under a single scheme and protected according to its class.

Gestión de defectos de seguridad del producto: Handling of product security defects
? Los problemas de seguridad del producto se revisan, valoran y corrigen según su gravedad, y la práctica se revisa periódicamente.
: Product security issues are reviewed, assessed and fixed according to severity, and the practice is reviewed periodically.

    dias: 23
    depende_de:
    - politicas
    controles:
    - seguridad-proveedores
    - cadena-suministro-tic
    entregables:
    - Controles de proveedores y cadena de suministro implantados con evidencia
  - clave: impl_incidentes
    nombre: 'Implantar controles: Incidentes y notificaciones'
    raci:
      R: responsable_seguridad
      A: direccion
      C:
      - ti
      - ot
      - responsable_cumplimiento
      I:
      - auditoria_interna
    dias: 19
    depende_de:
    - politicas
    controles:

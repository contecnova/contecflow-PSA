      A: direccion
      C:
      - responsable_cumplimiento
      - rrhh
      - ti
      I:
      - propietario_proceso
    dias: 30
    depende_de:
    - soa_aprobacion
    controles:
    - politica-seguridad-informacion
    - informacion-documentada
    - comunicacion-interna-externa
    entregables:
    - Políticas y procedimientos aprobados
  - clave: impl_gobierno
    nombre: 'Implantar controles: Gobierno del sistema de gestión'
    raci:
      R: responsable_seguridad
      A: direccion
      C:
      - responsable_cumplimiento
      I:
      - auditoria_interna
    dias: 51
    depende_de:
    - politicas
    controles:
    - contexto-partes-interesadas
    - alcance-sistema-gestion
    - recursos-competencia
    - informacion-documentada

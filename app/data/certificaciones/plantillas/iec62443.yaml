    controles:
    - actualizaciones-seguridad-producto
    - guias-seguridad-producto
    - interfaces-diagnostico-fisicas
    - resistencia-manipulacion-fisica
    - raices-confianza
    - arranque-seguro
    entregables:
    - Controles de seguridad del producto (software y dispositivos) implantados con evidencia
    aplica_si: desarrolla_producto == true
  - clave: impl_proveedores
    nombre: 'Implantar controles: Proveedores y cadena de suministro'
    raci:
      R: responsable_cumplimiento
      A: responsable_seguridad
      C:

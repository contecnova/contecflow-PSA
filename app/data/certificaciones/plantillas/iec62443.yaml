# Contenido redactado por contecflow. ISO/IEC 27001, IEC 62443, VDA ISA (TISAX) y COSO tienen derechos
# de autor: aquí solo hay identificadores y descripciones propias. NIS2 y la ley SOX son públicas.
# Ver docs/CERTIFICACIONES_CONTENIDO.md.
# Plantilla de programa. `aplica_si`: expresión simple sobre `parametros` (ver docs/CERTIFICACIONES_CONTENIDO.md §4).
# Si una tarea no aplica, sus sucesoras heredan sus dependencias.
clave: iec62443
nombre: Programa IEC 62443 (2-1, 3-2, 3-3, 4-1 y 4-2)
marcos:
- iec62443
parametros:
- clave: num_sedes
  tipo: entero
  opciones: null
  por_defecto: 12
- clave: tiene_ot
  tipo: booleano
  opciones: null
  por_defecto: true
- clave: sl_objetivo
  tipo: opcion
  opciones:
  - SL1
  - SL2
  - SL3
  - SL4
  por_defecto: SL3
- clave: desarrolla_producto
  tipo: booleano
  opciones: null
  por_defecto: true
fases:
- clave: arranque
  nombre: Arranque y alcance
  tareas:
  - clave: comite
    nombre: Constituir el comité del programa y nombrar al patrocinador de la dirección
    raci:
      R: responsable_cumplimiento
      A: direccion
      C:
      - responsable_seguridad
      - finanzas
      I:
      - ti
      - ot
      - rrhh
    dias: 10
    depende_de: []
    controles:
    - responsabilidad-direccion
    - roles-responsabilidades-seguridad
    entregables:
    - Acta de constitución del comité
    - Nombramientos firmados
  - clave: contexto
    nombre: Analizar el contexto, las partes interesadas y los requisitos legales por país
    raci:
      R: responsable_cumplimiento
      A: responsable_seguridad
      C:
      - direccion
      - finanzas
      I:
      - propietario_proceso
    dias: 10
    depende_de:
    - comite
    controles:
    - contexto-partes-interesadas
    - requisitos-legales
    entregables:
    - Análisis de contexto
    - Registro de requisitos legales
  - clave: alcance
    nombre: Definir y aprobar el alcance (entidades, sedes, plantas, sistemas y procesos)
    raci:
      R: responsable_seguridad
      A: direccion
      C:
      - responsable_cumplimiento
      - ot
      - finanzas
      I:
      - auditoria_interna
    dias: 10
    depende_de:
    - contexto
    controles:
    - alcance-sistema-gestion
    entregables:
    - Documento de alcance aprobado
  - clave: coordinacion_sedes
    nombre: Nombrar coordinadores por sede y acordar el modelo de muestreo multisede
    raci:
      R: responsable_cumplimiento
      A: direccion
      C:
      - responsable_seguridad
      I:
      - ti
      - ot
    dias: 10
    depende_de:
    - alcance
    controles:
    - roles-responsabilidades-seguridad
    entregables:
    - Red de coordinadores por sede
    - Plan de muestreo de sedes
    aplica_si: num_sedes > 1
  - clave: plan
    nombre: Elaborar el plan del programa, el calendario y el presupuesto
    raci:
      R: responsable_cumplimiento
      A: direccion
      C:
      - finanzas
      - responsable_seguridad
      I:
      - ti
      - ot
      - rrhh
    dias: 5
    depende_de:
    - alcance
    controles:
    - planificacion-operacional
    - objetivos-seguridad
    entregables:
    - Plan del programa
    - Presupuesto aprobado
  - clave: i6_programa
    nombre: Establecer el programa de seguridad OT del propietario del activo (2-1)
    raci:
      R: ot
      A: direccion
      C:
      - responsable_seguridad
      - ti
      I:
      - propietario_proceso
    dias: 20
    depende_de:
    - alcance
    controles:
    - programa-seguridad-ot
    entregables:
    - Programa OT aprobado
    aplica_si: tiene_ot == true
  - clave: i6_alcance_producto
    nombre: Definir a qué productos y versiones se aplica el desarrollo seguro (4-1)
    raci:
      R: propietario_proceso
      A: responsable_seguridad
      C:
      - ti
      I:
      - direccion
    dias: 10
    depende_de:
    - alcance
    controles:
    - alcance-proceso-desarrollo-seguro
    entregables:
    - Matriz de aplicabilidad por producto
    aplica_si: desarrolla_producto == true
- clave: carencias
  nombre: Análisis de carencias
  tareas:
  - clave: inventario
    nombre: Inventariar activos, sistemas, servicios externos y proveedores del alcance en la CMDB
    raci:
      R: ti
      A: responsable_seguridad
      C:
      - ot
      - propietario_proceso
      I:
      - responsable_cumplimiento
    dias: 20
    depende_de:
    - alcance
    controles:
    - inventario-activos
    - clasificacion-informacion
    entregables:
    - Inventario de activos en la CMDB
    - Listado de proveedores en alcance
  - clave: carencias
    nombre: Analizar carencias frente a la biblioteca de controles
    raci:
      R: responsable_seguridad
      A: responsable_cumplimiento
      C:
      - ti
      - ot
      - finanzas
      - rrhh
      I:
      - direccion
    dias: 25
    depende_de:
    - inventario
    - plan
    controles: []
    entregables:
    - Informe de carencias por control y sede
    - Estimación de esfuerzo de cierre
  - clave: i6_suc
    nombre: Definir los sistemas bajo consideración de cada planta (ZCR 1)
    raci:
      R: ot
      A: responsable_seguridad
      C:
      - ti
      - proveedor
      I:
      - propietario_proceso
    dias: 15
    depende_de:
    - i6_programa
    - inventario
    controles:
    - sistema-bajo-consideracion
    entregables:
    - Documento del sistema bajo consideración
    aplica_si: tiene_ot == true
  - clave: i6_carencias_41
    nombre: Analizar carencias del proceso de desarrollo frente a 4-1
    raci:
      R: propietario_proceso
      A: responsable_seguridad
      C:
      - ti
      I:
      - direccion
    dias: 20
    depende_de:
    - i6_alcance_producto
    controles:
    - ciclo-desarrollo-seguro
    entregables:
    - Informe de carencias 4-1
    aplica_si: desarrolla_producto == true
- clave: riesgos
  nombre: Análisis y tratamiento de riesgos
  tareas:
  - clave: metodologia_riesgos
    nombre: Aprobar la metodología de riesgos y los criterios de aceptación
    raci:
      R: responsable_seguridad
      A: direccion
      C:
      - responsable_cumplimiento
      - finanzas
      I:
      - auditoria_interna
    dias: 10
    depende_de:
    - plan
    controles:
    - evaluacion-riesgos
    entregables:
    - Metodología de riesgos aprobada
  - clave: evaluacion_riesgos
    nombre: Evaluar los riesgos con los propietarios de los procesos
    raci:
      R: responsable_seguridad
      A: responsable_cumplimiento
      C:
      - propietario_proceso
      - ti
      - ot
      I:
      - direccion
    dias: 25
    depende_de:
    - metodologia_riesgos
    - carencias
    controles:
    - evaluacion-riesgos
    entregables:
    - Registro de riesgos
  - clave: tratamiento_riesgos
    nombre: Elaborar el plan de tratamiento de riesgos y aceptar los residuales
    raci:
      R: responsable_seguridad
      A: direccion
      C:
      - propietario_proceso
      - finanzas
      I:
      - auditoria_interna
    dias: 10
    depende_de:
    - evaluacion_riesgos
    controles:
    - tratamiento-riesgos-declaracion-aplicabilidad
    entregables:
    - Plan de tratamiento de riesgos
    - Aceptación de riesgos residuales
  - clave: i6_riesgo_inicial
    nombre: Evaluación inicial de riesgos de ciberseguridad OT (ZCR 2)
    raci:
      R: ot
      A: responsable_seguridad
      C:
      - propietario_proceso
      I:
      - direccion
    dias: 15
    depende_de:
    - i6_suc
    - metodologia_riesgos
    controles:
    - evaluacion-riesgos-ot
    entregables:
    - Evaluación inicial OT
    aplica_si: tiene_ot == true
  - clave: i6_zonas
    nombre: Particionar en zonas y conductos y reflejarlos en la CMDB (ZCR 3)
    raci:
      R: ot
      A: responsable_seguridad
      C:
      - ti
      - proveedor
      I:
      - propietario_proceso
    dias: 20
    depende_de:
    - i6_riesgo_inicial
    controles:
    - zonas-y-conductos
    entregables:
    - Diagrama de zonas y conductos
    aplica_si: tiene_ot == true
  - clave: i6_riesgo_detallado
    nombre: Evaluación detallada y nivel de seguridad objetivo por zona (ZCR 4 y 5)
    raci:
      R: ot
      A: responsable_seguridad
      C:
      - propietario_proceso
      I:
      - direccion
    dias: 25
    depende_de:
    - i6_zonas
    controles:
    - evaluacion-riesgos-ot
    - nivel-seguridad-objetivo-por-zona
    entregables:
    - Registro de SL-T por zona
    aplica_si: tiene_ot == true
  - clave: i6_modelo_amenazas
    nombre: Modelar las amenazas de cada producto (4-1 SR-2)
    raci:
      R: propietario_proceso
      A: responsable_seguridad
      C:
      - ti
      I: []
    dias: 20
    depende_de:
    - i6_carencias_41
    controles:
    - modelado-amenazas
    - contexto-seguridad-producto
    entregables:
    - Modelos de amenazas
    aplica_si: desarrolla_producto == true
- clave: aplicabilidad
  nombre: Declaración de aplicabilidad y matriz de controles
  tareas:
  - clave: soa
    nombre: Elaborar la declaración de aplicabilidad y la matriz control × norma × sede
    raci:
      R: responsable_seguridad
      A: responsable_cumplimiento
      C:
      - ti
      - ot
      - finanzas
      I:
      - auditoria_interna
    dias: 10
    depende_de:
    - tratamiento_riesgos
    controles:
    - tratamiento-riesgos-declaracion-aplicabilidad
    entregables:
    - Declaración de aplicabilidad
    - Matriz cruzada de controles
  - clave: soa_aprobacion
    nombre: Aprobar la declaración de aplicabilidad
    raci:
      R: responsable_seguridad
      A: direccion
      C:
      - responsable_cumplimiento
      I:
      - auditoria_interna
      - ti
      - ot
    dias: 3
    depende_de:
    - soa
    controles:
    - tratamiento-riesgos-declaracion-aplicabilidad
    entregables:
    - Declaración de aplicabilidad aprobada (flujo de Documentos)
  - clave: i6_crs
    nombre: Especificar los requisitos de ciberseguridad y obtener la aprobación del propietario (ZCR 6 y 7)
    raci:
      R: ot
      A: direccion
      C:
      - responsable_seguridad
      I:
      - propietario_proceso
    dias: 15
    depende_de:
    - i6_riesgo_detallado
    controles:
    - especificacion-requisitos-ciberseguridad
    - aprobacion-propietario-activo
    entregables:
    - Especificación aprobada
    aplica_si: tiene_ot == true
  - clave: i6_brecha_sl
    nombre: Comparar el SL objetivo con el alcanzado por zona usando los requisitos de 3-3
    raci:
      R: ot
      A: responsable_seguridad
      C:
      - ti
      I: []
    dias: 15
    depende_de:
    - i6_crs
    controles:
    - nivel-seguridad-objetivo-por-zona
    entregables:
    - Análisis de brecha SL
    aplica_si: tiene_ot == true
  - clave: i6_mejoras_sl_alto
    nombre: Seleccionar las mejoras de requisitos para zonas con SL3 o SL4
    raci:
      R: ot
      A: responsable_seguridad
      C:
      - ti
      - proveedor
      I: []
    dias: 10
    depende_de:
    - i6_brecha_sl
    controles:
    - nivel-seguridad-objetivo-por-zona
    entregables:
    - Lista de mejoras de requisitos por zona
    aplica_si: tiene_ot == true and sl_objetivo in ['SL3', 'SL4']
- clave: implantacion
  nombre: Diseño e implantación
  tareas:
  - clave: politicas
    nombre: Redactar y aprobar políticas y procedimientos con el flujo de Documentos

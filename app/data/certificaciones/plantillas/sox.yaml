- clave: auditoria_interna
  nombre: Auditoría interna
  tareas:
  - clave: plan_auditoria
    nombre: Planificar la auditoría interna (independiente de quien implantó)
    raci:
      R: auditoria_interna
      A: direccion
      C:
      - responsable_seguridad
      I:
      - responsable_cumplimiento
    dias: 5
    depende_de:
    - politicas
    - impl_gobierno
    - impl_accesos
    - impl_operaciones
    - impl_desarrollo
    - impl_proveedores
    - impl_continuidad
    - impl_cumplimiento
    - impl_informacion_financiera_1
    - impl_informacion_financiera_2
    - cumplimiento_continuo_alta
    - sx_soc1
    - sx_pruebas_diseno
    - concienciacion
    - formacion_especifica
    controles:
    - auditoria-interna
    entregables:
    - Programa y plan de auditoría
  - clave: ejecucion_auditoria
    nombre: Ejecutar la auditoría interna en todas las normas y sedes del muestreo
    raci:
      R: auditoria_interna
      A: direccion
      C:
      - responsable_seguridad
      - propietario_proceso
      I:
      - ti
      - ot
    dias: 15
    depende_de:
    - plan_auditoria
    controles:
    - auditoria-interna
    - cumplimiento-politicas
    entregables:
    - Papeles de trabajo
    - Hallazgos registrados
  - clave: informe_auditoria
    nombre: Informe de auditoría interna y apertura de acciones correctivas
    raci:
      R: auditoria_interna
      A: direccion
      C:
      - responsable_seguridad
      I:
      - responsable_cumplimiento
    dias: 5
    depende_de:
    - ejecucion_auditoria
    controles:
    - auditoria-interna
    - no-conformidades-acciones-correctivas
    entregables:

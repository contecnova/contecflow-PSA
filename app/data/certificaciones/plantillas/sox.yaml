      I:
      - direccion
    dias: 30
    depende_de:
    - plan_formacion
    - politicas
    controles:
    - formacion-concienciacion
    entregables:
    - Registros de asistencia
    - Resultados de evaluación
  - clave: formacion_especifica
    nombre: Formación específica de responsables de control y equipos técnicos
    raci:
      R: rrhh
      A: responsable_seguridad
      C:
      - ti
      - ot

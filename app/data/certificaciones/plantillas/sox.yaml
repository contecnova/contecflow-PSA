- clave: revision_direccion
  nombre: Revisión por la dirección
  tareas:
  - clave: revision
    nombre: Revisión por la dirección del programa
    raci:
      R: responsable_seguridad
      A: direccion
      C:
      - responsable_cumplimiento
      - finanzas
      - auditoria_interna

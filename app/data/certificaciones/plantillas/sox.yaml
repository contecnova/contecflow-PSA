  - clave: sx_roll_forward
    nombre: Pruebas de actualización al cierre del ejercicio
    raci:
      R: auditoria_interna
      A: finanzas
      C:
      - propietario_proceso
      I:
      - direccion
    dias: 15
    depende_de:
    - sx_pruebas_eficacia
    controles:
    - cierre-periodos-contables
    entregables:
    - Pruebas de actualización
  - clave: sx_deficiencias
    nombre: Evaluar y agregar las deficiencias de control
    raci:

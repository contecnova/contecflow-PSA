- clave: cierre_hallazgos
  nombre: Cierre de hallazgos
  tareas:
  - clave: capa
    nombre: Analizar causas y planificar las acciones correctivas de todos los hallazgos externos
    raci:
      R: responsable_seguridad
      A: responsable_cumplimiento

    depende_de:
    - politicas
    controles:
    - alcance-cuentas-significativas
    - acceso-directo-datos-financieros
    - certificacion-estados-financieros
    - evaluacion-direccion-control-interno
    - atestacion-auditor-externo
    - ambiente-control-etica
    - supervision-comite-auditoria
    - riesgo-fraude
    - evaluacion-deficiencias-control
    - cierre-periodos-contables
    entregables:
    - Controles de control interno sobre la información financiera implantados con evidencia
  - clave: impl_informacion_financiera_2
    nombre: 'Implantar controles: Control interno sobre la información financiera (2/2)'
    raci:
      R: finanzas
      A: direccion
      C:
      - auditoria_interna
      - ti
      I:
      - auditoria_interna
    dias: 39
    depende_de:
    - politicas
    controles:
    - asientos-manuales
    - conciliaciones-cuentas
    - hojas-calculo-criticas
    - informacion-generada-por-entidad
    - controles-aplicacion
    - entorno-ti-comprension

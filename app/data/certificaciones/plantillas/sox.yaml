    - no-conformidades-acciones-correctivas
    entregables:
    - Plan de acciones correctivas
  - clave: verificacion_eficacia
    nombre: Verificar la eficacia de las acciones (quien verifica no es quien corrigió)
    raci:
      R: auditoria_interna
      A: responsable_cumplimiento
      C:
      - responsable_seguridad
      I:
      - direccion
    dias: 45
    depende_de:

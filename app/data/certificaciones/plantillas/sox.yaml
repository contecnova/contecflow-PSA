    - politicas
    controles:
    - seguimiento-proveedores
    entregables:
    - Controles de proveedores y cadena de suministro implantados con evidencia
  - clave: impl_continuidad
    nombre: 'Implantar controles: Continuidad y recuperación'
    raci:
      R: ti
      A: direccion
      C:
      - ot
      - propietario_proceso
      I:
      - auditoria_interna
    dias: 23
    depende_de:
    - politicas
    controles:
    - preparacion-tic-continuidad
    - copias-seguridad
    entregables:
    - Controles de continuidad y recuperación implantados con evidencia
  - clave: impl_cumplimiento
    nombre: 'Implantar controles: Cumplimiento legal y privacidad'
    raci:
      R: responsable_cumplimiento
      A: direccion
      C:
      - rrhh
      - ti
      I:
      - auditoria_interna
    dias: 19
    depende_de:
    - politicas
    controles:
    - proteccion-registros
    entregables:
    - Controles de cumplimiento legal y privacidad implantados con evidencia
  - clave: impl_informacion_financiera_1
    nombre: 'Implantar controles: Control interno sobre la información financiera (1/2)'
    raci:

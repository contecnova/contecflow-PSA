  - clave: sx_soc1
    nombre: Obtener informes SOC 1 tipo II de proveedores y validar los controles complementarios
    raci:
      R: finanzas
      A: responsable_cumplimiento
      C:
      - ti
      - proveedor
      I:
      - auditoria_interna
    dias: 15
    depende_de:
    - sx_rcm
    controles:
    - seguimiento-proveedores
    entregables:

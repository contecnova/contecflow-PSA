    entregables:
    - Acta de revisión por la dirección
  - clave: sx_certificaciones
    nombre: Subcertificaciones y certificaciones de las secciones 302 y 906
    raci:
      R: finanzas
      A: direccion
      C:
      - auditoria_interna
      I:
      - responsable_cumplimiento
    dias: 10
    depende_de:
    - sx_deficiencias
    - revision
    controles:
    - certificacion-estados-financieros
    entregables:
    - Certificaciones firmadas
  - clave: sx_informe_404a
    nombre: Informe de la dirección sobre el control interno (sección 404(a))
    raci:
      R: finanzas
      A: direccion
      C:
      - auditoria_interna
      I:
      - responsable_cumplimiento
    dias: 10
    depende_de:
    - sx_certificaciones
    controles:
    - evaluacion-direccion-control-interno
    entregables:
    - Informe 404(a)
- clave: certificacion
  nombre: Auditorías de certificación o evaluación
  tareas:
  - clave: sx_auditoria_404b
    nombre: Auditoría externa integrada del control interno (sección 404(b))
    raci:
      R: finanzas
      A: direccion
      C:

    controles:
    - atestacion-auditor-externo
    entregables:
    - Informe del auditor externo
  - clave: sx_comite
    nombre: Presentar los resultados al comité de auditoría
    raci:
      R: finanzas
      A: direccion
      C:
      - auditoria_interna
      I: []
    dias: 2
    depende_de:
    - sx_auditoria_404b

  - clave: impl_desarrollo
    nombre: 'Implantar controles: Desarrollo y gestión de cambios'
    raci:
      R: propietario_proceso
      A: responsable_seguridad
      C:
      - ti
      - auditoria_interna
      I:
      - auditoria_interna
    dias: 47
    depende_de:
    - politicas
    controles:
    - ciclo-desarrollo-seguro
    - pruebas-aceptacion-usuario
    - migracion-conversion-datos
    - separacion-entornos
    - gestion-cambios
    - pruebas-cambios
    - aprobacion-independiente-paso-produccion
    - cambios-emergencia

# Contenido redactado por contecflow. ISO/IEC 27001, IEC 62443, VDA ISA (TISAX) y COSO tienen derechos
# de autor: aquí solo hay identificadores y descripciones propias. NIS2 y la ley SOX son públicas.
# Ver docs/CERTIFICACIONES_CONTENIDO.md.
# Plantilla de programa. `aplica_si`: expresión simple sobre `parametros` (ver docs/CERTIFICACIONES_CONTENIDO.md §4).
# Si una tarea no aplica, sus sucesoras heredan sus dependencias.
clave: iso27001
nombre: Certificación ISO/IEC 27001:2022
marcos:
- iso27001
parametros:
- clave: num_sedes
  tipo: entero
  opciones: null
  por_defecto: 12
fases:
- clave: arranque
  nombre: Arranque y alcance
  tareas:
  - clave: comite
    nombre: Constituir el comité del programa y nombrar al patrocinador de la dirección
    raci:
      R: responsable_cumplimiento
      A: direccion
      C:
      - responsable_seguridad
      - finanzas
      I:
      - ti
      - ot
      - rrhh
    dias: 10
    depende_de: []
    controles:
    - responsabilidad-direccion
    - roles-responsabilidades-seguridad
    entregables:
    - Acta de constitución del comité
    - Nombramientos firmados
  - clave: contexto
    nombre: Analizar el contexto, las partes interesadas y los requisitos legales por país
    raci:
      R: responsable_cumplimiento
      A: responsable_seguridad
      C:
      - direccion
      - finanzas
      I:
      - propietario_proceso
    dias: 10
    depende_de:
    - comite
    controles:
    - contexto-partes-interesadas
    - requisitos-legales
    entregables:
    - Análisis de contexto
    - Registro de requisitos legales
  - clave: alcance
    nombre: Definir y aprobar el alcance (entidades, sedes, plantas, sistemas y procesos)
    raci:
      R: responsable_seguridad
      A: direccion
      C:
      - responsable_cumplimiento
      - ot
      - finanzas
      I:
      - auditoria_interna
    dias: 10
    depende_de:
    - contexto
    controles:
    - alcance-sistema-gestion
    entregables:
    - Documento de alcance aprobado
  - clave: coordinacion_sedes
    nombre: Nombrar coordinadores por sede y acordar el modelo de muestreo multisede
    raci:
      R: responsable_cumplimiento
      A: direccion
      C:
      - responsable_seguridad
      I:
      - ti
      - ot
    dias: 10
    depende_de:
    - alcance
    controles:
    - roles-responsabilidades-seguridad
    entregables:
    - Red de coordinadores por sede
    - Plan de muestreo de sedes
    aplica_si: num_sedes > 1
  - clave: plan
    nombre: Elaborar el plan del programa, el calendario y el presupuesto
    raci:
      R: responsable_cumplimiento
      A: direccion
      C:
      - finanzas
      - responsable_seguridad
      I:
      - ti
      - ot
      - rrhh
    dias: 5
    depende_de:
    - alcance
    controles:
    - planificacion-operacional
    - objetivos-seguridad
    entregables:
    - Plan del programa
    - Presupuesto aprobado
  - clave: iso_entidad
    nombre: Seleccionar la entidad de certificación acreditada y acordar el calendario
    raci:
      R: responsable_cumplimiento
      A: direccion
      C:
      - responsable_seguridad
      I:
      - finanzas
    dias: 15
    depende_de:
    - plan
    controles: []
    entregables:
    - Contrato con la entidad de certificación
- clave: carencias
  nombre: Análisis de carencias
  tareas:
  - clave: inventario
    nombre: Inventariar activos, sistemas, servicios externos y proveedores del alcance en la CMDB
    raci:
      R: ti
      A: responsable_seguridad
      C:
      - ot
      - propietario_proceso
      I:
      - responsable_cumplimiento
    dias: 20
    depende_de:
    - alcance
    controles:
    - inventario-activos
    - clasificacion-informacion
    entregables:
    - Inventario de activos en la CMDB
    - Listado de proveedores en alcance
  - clave: carencias
    nombre: Analizar carencias frente a la biblioteca de controles
    raci:
      R: responsable_seguridad
      A: responsable_cumplimiento
      C:
      - ti
      - ot
      - finanzas
      - rrhh
      I:
      - direccion
    dias: 25
    depende_de:
    - inventario
    - plan
    controles: []
    entregables:
    - Informe de carencias por control y sede
    - Estimación de esfuerzo de cierre
- clave: riesgos
  nombre: Análisis y tratamiento de riesgos
  tareas:
  - clave: metodologia_riesgos
    nombre: Aprobar la metodología de riesgos y los criterios de aceptación

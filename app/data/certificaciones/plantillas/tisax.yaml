riesgos:
- clave: falta-patrocinio
  titulo: Falta de patrocinio real de la dirección
  probabilidad: media
  impacto: alto
  mitigacion: Patrocinador nombrado en el arranque, revisión mensual del avance en el comité y objetivos ligados
    a la dirección.
- clave: recursos-insuficientes
  titulo: Recursos internos insuficientes para implantar y mantener los controles
  probabilidad: alta
  impacto: alto
  mitigacion: Plan de capacidad por rol, apoyo externo acotado y priorización por riesgo.
- clave: evidencias-dispersas
  titulo: Evidencias dispersas, caducadas o sin flujo de aprobación
  probabilidad: alta
  impacto: medio
  mitigacion: Evidencias solo en Documentos con flujo, caducidad y avisos; medición automática donde sea posible.
- clave: alcance-mal-definido
  titulo: Alcance mal definido o cambiante
  probabilidad: media
  impacto: alto
  mitigacion: Alcance aprobado por la dirección y control de cambios del alcance en el comité.
- clave: resistencia-cambio
  titulo: Resistencia al cambio de procesos y herramientas
  probabilidad: media
  impacto: medio
  mitigacion: Comunicación, formación por perfiles y responsables de control en cada área.
- clave: prototipos-area-insuficiente
  titulo: Áreas de prototipos que no cumplen los requisitos físicos
  probabilidad: media
  impacto: alto
  mitigacion: Inspección temprana de áreas y obras planificadas antes de la evaluación.
- clave: etiqueta-caducada
  titulo: Caducidad de la etiqueta TISAX sin reevaluación
  probabilidad: baja
  impacto: alto
  mitigacion: Aviso de vencimiento en el punto de control con 9 meses de antelación.

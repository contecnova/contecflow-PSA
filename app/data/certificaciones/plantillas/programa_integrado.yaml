    aplica_si: desarrolla_producto == true
riesgos:
- clave: falta-patrocinio
  titulo: Falta de patrocinio real de la dirección
  probabilidad: media
  impacto: alto
  mitigacion: Patrocinador nombrado en el arranque, revisión mensual del avance en el comité y objetivos ligados
    a la dirección.
- clave: recursos-insuficientes
  titulo: Recursos internos insuficientes para implantar y mantener los controles
  probabilidad: alta
  impacto: alto
  mitigacion: Plan de capacidad por rol, apoyo externo acotado y priorización por riesgo.
- clave: evidencias-dispersas
  titulo: Evidencias dispersas, caducadas o sin flujo de aprobación
  probabilidad: alta
  impacto: medio
  mitigacion: Evidencias solo en Documentos con flujo, caducidad y avisos; medición automática donde sea posible.
- clave: alcance-mal-definido
  titulo: Alcance mal definido o cambiante
  probabilidad: media
  impacto: alto
  mitigacion: Alcance aprobado por la dirección y control de cambios del alcance en el comité.
- clave: resistencia-cambio
  titulo: Resistencia al cambio de procesos y herramientas
  probabilidad: media
  impacto: medio
  mitigacion: Comunicación, formación por perfiles y responsables de control en cada área.
- clave: nc-mayor-fase2
  titulo: No conformidad mayor en la fase 2 que retrase el certificado
  probabilidad: media
  impacto: alto
  mitigacion: Auditoría interna completa y simulacro de fase 2 antes de la auditoría externa.
- clave: prototipos-area-insuficiente
  titulo: Áreas de prototipos que no cumplen los requisitos físicos
  probabilidad: media
  impacto: alto
  mitigacion: Inspección temprana de áreas y obras planificadas antes de la evaluación.
- clave: etiqueta-caducada
  titulo: Caducidad de la etiqueta TISAX sin reevaluación
  probabilidad: baja
  impacto: alto
  mitigacion: Aviso de vencimiento en el punto de control con 9 meses de antelación.
- clave: plazo-notificacion
  titulo: Incumplir el plazo de 24 h o 72 h en un incidente significativo
  probabilidad: media
  impacto: critico
  mitigacion: Flujo con relojes, guardias definidas, plantillas y simulacros semestrales.
- clave: responsabilidad-personal
  titulo: Responsabilidad personal de la dirección por falta de supervisión
  probabilidad: baja
  impacto: critico
  mitigacion: Aprobación formal de medidas, formación de la dirección y actas de supervisión.
- clave: debilidad-material
  titulo: Debilidad material en ITGC que afecte a la opinión del auditor
  probabilidad: media
  impacto: critico
  mitigacion: Pruebas intermedias tempranas, corrección antes del cierre y roll-forward.
- clave: sod-erp
  titulo: Conflictos de segregación de funciones en el ERP
  probabilidad: alta
  impacto: alto
  mitigacion: Matriz SoD, detección automática y controles compensatorios documentados.
- clave: plazo-informe-jsox
  titulo: Retraso del informe de control interno respecto al informe anual
  probabilidad: media
  impacto: alto
  mitigacion: Calendario sincronizado con el cierre y reutilización de las pruebas SOX.
- clave: diferencias-criterio-jsox
  titulo: Diferencias de criterio entre auditores de EE. UU. y Japón
  probabilidad: media
  impacto: medio
  mitigacion: Matriz única con correspondencias y acuerdos de muestreo comunes.
- clave: parada-planta
  titulo: Parada de planta al aplicar controles en OT
  probabilidad: media
  impacto: critico
  mitigacion: Pruebas en entorno de réplica, ventanas de mantenimiento y vuelta atrás planificada.
- clave: legado-ot
  titulo: Sistemas OT antiguos sin soporte que no alcanzan el SL objetivo
  probabilidad: alta
  impacto: alto
  mitigacion: Contramedidas compensatorias por zona, aislamiento y plan de renovación.
- clave: proceso-sdl-sin-independencia
  titulo: Revisión de versiones sin independencia real
  probabilidad: media
  impacto: alto
  mitigacion: Revisión por versión por persona distinta del autor, registrada en la plataforma.
- clave: duplicidad-trabajo
  titulo: Trabajo duplicado entre normas y auditores
  probabilidad: alta
  impacto: medio
  mitigacion: Biblioteca única de controles, matriz única y plan único de pruebas reutilizable.

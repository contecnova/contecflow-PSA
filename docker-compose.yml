# ══════════════════════════════════════════════════════════════════════════════
# Contecflow PSA — Docker Compose
# Para producción: docker compose --env-file .env.prod up -d
# Para desarrollo: docker compose up -d
# ══════════════════════════════════════════════════════════════════════════════

services:

  # ── DB Migrations (init-container) ──────────────────────────────────────────
  # Runs Alembic upgrade head ONCE before the backend starts, preventing race
  # conditions when multiple backend replicas boot in parallel (rolling deploy).
  migrate:
    image: ${BACKEND_IMAGE:-}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contecflow-migrate
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://contecflow:contecflow@db:5432/contecflow}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY requerido}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - contecflow-net

  # ── Backend FastAPI ──────────────────────────────────────────────────────────
  backend:
    image: ${BACKEND_IMAGE:-}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contecflow-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://contecflow:contecflow@db:5432/contecflow}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY requerido}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["http://localhost","http://localhost:80"]}
      REDIS_URL: redis://:${REDIS_PASSWORD:-contecflow_redis}@redis:6379/0
      # Migrations are handled by the 'migrate' init-container above
      SKIP_STARTUP_MIGRATIONS: "1"
      # Celery beat handles periodic jobs in production
      ENABLE_APSCHEDULER: "0"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - contecflow-net

  # ── Celery Worker (background jobs) ─────────────────────────────────────────
  worker:
    image: ${BACKEND_IMAGE:-}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contecflow-worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://contecflow:contecflow@db:5432/contecflow}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY requerido}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      REDIS_URL: redis://:${REDIS_PASSWORD:-contecflow_redis}@redis:6379/0
      SKIP_STARTUP_MIGRATIONS: "1"
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - contecflow-net

  # ── Celery Beat (scheduled jobs) ───────────────────────────────────────────
  beat:
    image: ${BACKEND_IMAGE:-}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contecflow-beat
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://contecflow:contecflow@db:5432/contecflow}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY requerido}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      REDIS_URL: redis://:${REDIS_PASSWORD:-contecflow_redis}@redis:6379/0
      SKIP_STARTUP_MIGRATIONS: "1"
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=INFO"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - contecflow-net

  # ── Frontend Nginx ───────────────────────────────────────────────────────────
  frontend:
    image: ${FRONTEND_IMAGE:-}
    build:
      context: frontend
      dockerfile: Dockerfile.prod
    container_name: contecflow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - contecflow-net

  # ── Nginx Reverse Proxy ──────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: contecflow-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/lib/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - contecflow-net

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: contecflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-contecflow}
      POSTGRES_USER: ${POSTGRES_USER:-contecflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-contecflow} -d ${POSTGRES_DB:-contecflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - contecflow-net

  # ── Redis (cache + sesiones) ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: contecflow-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-contecflow_redis}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - contecflow-net

volumes:
  postgres-data:
  redis-data:
  uploads:
  certbot-etc:
  certbot-var:

networks:
  contecflow-net:
    driver: bridge

# ══════════════════════════════════════════════════════════════════════════════
# Contecflow PSA — configuración de Prometheus (perfil `observability`)
#
# La aplicación expone /metrics en formato Prometheus cuando METRICS_ENABLED=1
# (ver app/core/metrics.py). docker-compose.yml lo fuerza en el contenedor `api`.
#
# Se levanta con:
#   ./setup.sh docker        (o setup.bat docker): todo el stack
#   docker compose --profile observability up -d
#
# Los objetivos se resuelven por nombre de servicio dentro de la red de compose,
# así que no hay ninguna IP ni puerto de host escrito aquí.
#
# Retención: la fijan las variables PROMETHEUS_RETENTION (15d) y
# PROMETHEUS_RETENTION_SIZE (5GB) del .env, en el `command` del compose.
# Documentación completa: docs/OBSERVABILIDAD.md.
# ══════════════════════════════════════════════════════════════════════════════
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    app: contecflow

# ── Alertas ───────────────────────────────────────────────────────────────────
rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # ── La propia aplicación ────────────────────────────────────────────────────
  # /metrics exige `Authorization: Bearer <METRICS_AUTH_TOKEN>` fuera de
  # development/test. El token NO se escribe aquí: el contenedor lo copia de su
  # entorno a un tmpfs al arrancar (docker-compose.yml) y Prometheus lo lee de
  # ese fichero. Si el token de Admin → Configuración (app_settings) no coincide
  # con el del .env, este objetivo sale `down` con 401: a propósito, visible.
  - job_name: contecflow-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/contecflow/metrics_token
    static_configs:
      - targets: ["api:8000"]
        labels:
          component: api

  # ── Worker y beat de Celery ─────────────────────────────────────────────────
  # Servidor de métricas propio (CELERY_METRICS_PORT), solo en la red interna.
  - job_name: celery-worker
    static_configs:
      - targets: ["worker:9808"]
        labels:
          component: worker

  - job_name: celery-beat
    static_configs:
      - targets: ["beat:9809"]
        labels:
          component: beat

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          component: database

  # ── Redis ───────────────────────────────────────────────────────────────────
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          component: cache

  # ── Máquina y contenedores (perfil `host-metrics`) ──────────────────────────
  # En Docker Desktop (Windows/macOS) node-exporter mide la máquina virtual Linux
  # de Docker, no el Windows anfitrión. Si no se levantan, estos objetivos salen
  # `down` (docs/OBSERVABILIDAD.md §Docker Desktop).
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          component: host

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          component: containers

  # ── Almacén S3 ──────────────────────────────────────────────────────────────
  # Aquí se rascaba MinIO. versitygw, que lo sustituye, no expone métricas en
  # formato Prometheus, y un objetivo que no contesta nunca es una alarma que se
  # aprende a ignorar. Su salud la vigila el healthcheck del compose.

  # ── La propia pila de observabilidad ────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  # Grafana no se rasca: su /metrics no lleva autenticación, así que en el
  # compose va apagado (GF_METRICS_ENABLED=false). Su salud la vigila el
  # healthcheck del contenedor.

[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*
addopts =
    -v
    --tb=short
    -p no:warnings
    --strict-markers
markers =
    slow: tests lentos (>2s)
    smoke: smoke tests básicos de sanidad
    auth: tests de autenticación y permisos
    crud: tests de operaciones CRUD
    integration: tests de integración entre módulos

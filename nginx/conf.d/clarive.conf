server {
  listen 80;
  server_name _;

  # Redirect all HTTP to HTTPS. Remove this block and use the HTTP-only
  # server block below if TLS is not yet active.
  return 301 https://$host$request_uri;
}

# ── TLS server block ─────────────────────────────────────────────────────────
# Replace ssl_certificate paths with your actual certificate files before
# enabling. With Docker, mount certs as a volume or use Certbot.
server {
  listen 443 ssl;
  http2  on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;

  # Hide nginx version from error pages and Server header
  server_tokens off;

  # Security headers (defense-in-depth alongside FastAPI middleware)
  add_header X-Content-Type-Options    "nosniff"                          always;
  add_header X-Frame-Options           "DENY"                             always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;
  add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Content Security Policy — tightened for the React/Vite SPA.
  # • script-src 'self'           — only bundled assets; blocks injected/CDN scripts
  # • style-src  'self' 'unsafe-inline' — Tailwind + CSS-in-JS need inline styles
  # • img-src    'self' data: blob: — recharts data: URIs + blob: for canvas exports
  # • connect-src 'self' wss:      — same-origin API + WebSocket (yjs collaboration)
  # • frame-ancestors 'none'       — redundant with X-Frame-Options but required by CSP3
  # • form-action 'self'           — prevents form hijacking
  # • base-uri   'self'            — blocks <base> tag injection
  # • object-src 'none'            — disables Flash/plugin objects
  add_header Content-Security-Policy
    "default-src 'self';\
     script-src  'self';\
     style-src   'self' 'unsafe-inline';\
     img-src     'self' data: blob:;\
     font-src    'self';\
     connect-src 'self' ws: wss:;\
     media-src   'none';\
     object-src  'none';\
     frame-src   'none';\
     frame-ancestors 'none';\
     form-action 'self';\
     base-uri    'self';\
     worker-src  'self' blob:;"
    always;

  # API
  location /api/ {
    proxy_pass http://backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # WebSocket
  location /api/v1/ws/ {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  # Frontend SPA
  location / {
    proxy_pass http://frontend;
    proxy_set_header Host $host;
    try_files $uri $uri/ /index.html;
  }
}

# ── HTTP-only fallback (dev / pre-TLS) ───────────────────────────────────────

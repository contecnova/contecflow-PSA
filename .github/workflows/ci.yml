name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx coverage pytest-html pip-audit
      - name: Run pip-audit (seguridad)
        run: pip-audit
      - name: Run tests
        run: pytest tests/ -v --tb=short
      - name: Run coverage
        run: |
          coverage run -m pytest tests/ -v --tb=short
          coverage xml -o test-results/coverage.xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: test-results/coverage.xml

  frontend-a11y-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run accessibility lint report (full frontend)
        run: npm run lint:a11y:report
        continue-on-error: true
      - name: Run accessibility strict batch 1
        run: npm run lint:a11y:strict:batch1

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: contec
          POSTGRES_PASSWORD: contec
          POSTGRES_DB: contecflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U contec"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://contec:contec@localhost:5432/contecflow_test
      SECRET_KEY: ${{ secrets.CI_SECRET_KEY || 'ci-secret-key-at-least-32-chars-long' }}
      ENVIRONMENT: test
      DEFAULT_USER_PASSWORD: ${{ secrets.CI_DEFAULT_USER_PASSWORD || 'CI-test-password-2026!' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests/ -x -q --tb=short

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint -- --max-warnings 0
      - name: i18n coverage check
        run: node scripts/check_portal_i18n_missing.cjs
      - name: Unit tests
        run: npm test -- --run

name: CI

# Auditoría 2026-08 §2: hasta ahora el único workflow ejecutaba 5 ficheros de test
# de los 193 que hay. Los 1.814 tests de backend, los 86 de frontend, `tsc` y el
# build no corrían en ningún sitio, y como se commitea directo a main sin PR, nada
# impedía romper main. Este workflow cubre ese hueco.

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  # Un push nuevo cancela el run anterior de la misma rama: main recibe commits
  # seguidos y no tiene sentido pagar por validar un estado ya superado.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -n auto: la suite es xdist-safe (verificado — serial y paralelo dan el mismo
      # resultado) y baja de ~64 min a ~11.
      - name: Run test suite
        run: |
          python -m pytest -n auto -q --tb=short

  frontend:
    name: Frontend — tipos, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

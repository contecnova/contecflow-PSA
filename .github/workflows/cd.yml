# ══════════════════════════════════════════════════════════════════════════════
# Clarive PSA — CD Pipeline
#
# Builds and pushes Docker images to GitHub Container Registry (GHCR),
# then deploys to the target environment via SSH.
#
# Environments:
#   staging    — triggered by push to develop
#   production — triggered by push to main OR creation of a vX.Y.Z tag
#
# Required Secrets (Settings → Secrets and variables → Actions):
#   (GHCR auth uses the built-in GITHUB_TOKEN — no PAT needed)
#   STAGING_HOST          — Staging server IP / hostname
#   STAGING_SSH_USER      — SSH user on staging server (e.g. clarive)
#   STAGING_SSH_KEY       — Private SSH key (base64 PEM) for staging
#   PROD_HOST             — Production server IP / hostname
#   PROD_SSH_USER         — SSH user on production server
#   PROD_SSH_KEY          — Private SSH key (base64 PEM) for production
#   SLACK_WEBHOOK_URL     — (Optional) Slack incoming webhook for notifications
# ══════════════════════════════════════════════════════════════════════════════

name: CD

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

  # Allow manual trigger from the GitHub UI
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [staging, production]
      image_tag:
        description: "Image tag to deploy (leave blank for current commit SHA)"
        required: false
        default: ""

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false   # Never cancel an in-flight deploy

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/clarive-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/clarive-frontend

# ── Jobs ───────────────────────────────────────────────────────────────────────

jobs:

  # ── Determine environment & image tag ──────────────────────────────────────
  resolve-env:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}
    steps:
      - id: resolve
        run: |
          # Determine environment
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]] || \
               [[ "${{ github.ref }}" =~ ^refs/tags/v[0-9] ]]; then
            ENV="production"
          else
            ENV="staging"
          fi

          # Determine image tag
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && \
                -n "${{ github.event.inputs.image_tag }}" ]]; then
            TAG="${{ github.event.inputs.image_tag }}"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/(v.+)$ ]]; then
            TAG="${BASH_REMATCH[1]}"
          else
            TAG="${{ github.sha }}"
          fi

          echo "environment=$ENV" >> "$GITHUB_OUTPUT"
          echo "image_tag=$TAG"   >> "$GITHUB_OUTPUT"
          echo "Deploying to: $ENV with tag: $TAG"

  # ── Build & push Docker images ──────────────────────────────────────────────
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    needs: resolve-env
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.meta-backend.outputs.tags }}
      frontend_image: ${{ steps.meta-frontend.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Backend ──────────────────────────────────────────────────────────────
      - name: Extract backend metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=${{ needs.resolve-env.outputs.image_tag }}
            type=raw,value=latest,enable=${{ needs.resolve-env.outputs.environment == 'production' }}
            type=raw,value=staging-latest,enable=${{ needs.resolve-env.outputs.environment == 'staging' }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Frontend ─────────────────────────────────────────────────────────────
      - name: Extract frontend metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value=${{ needs.resolve-env.outputs.image_tag }}
            type=raw,value=latest,enable=${{ needs.resolve-env.outputs.environment == 'production' }}
            type=raw,value=staging-latest,enable=${{ needs.resolve-env.outputs.environment == 'staging' }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to staging ──────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: [resolve-env, build-and-push]
    if: needs.resolve-env.outputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging.clarive.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -euo pipefail
            export GHCR_TOKEN="${{ secrets.GITHUB_TOKEN }}"
            export GHCR_USER="${{ github.actor }}"
            export BACKEND_IMAGE="${{ env.BACKEND_IMAGE }}:${{ needs.resolve-env.outputs.image_tag }}"
            export FRONTEND_IMAGE="${{ env.FRONTEND_IMAGE }}:${{ needs.resolve-env.outputs.image_tag }}"
            bash /opt/clarive/scripts/deploy.sh staging

      - name: Notify Slack (staging deployed)
        if: always() && vars.SLACK_NOTIFY == 'true'
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "${{ job.status == 'success' && '✅' || '❌' }} *Staging deployed* — `${{ needs.resolve-env.outputs.image_tag }}` by @${{ github.actor }}",
              "blocks": [{
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "${{ job.status == 'success' && '✅' || '❌' }} *Clarive PSA — Staging* deployed `${{ needs.resolve-env.outputs.image_tag }}`\nTriggered by: @${{ github.actor }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
                }
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  # ── Deploy to production ───────────────────────────────────────────────────
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: [resolve-env, build-and-push]
    if: needs.resolve-env.outputs.environment == 'production'
    environment:
      name: production
      url: https://clarive.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -euo pipefail
            export GHCR_TOKEN="${{ secrets.GITHUB_TOKEN }}"
            export GHCR_USER="${{ github.actor }}"
            export BACKEND_IMAGE="${{ env.BACKEND_IMAGE }}:${{ needs.resolve-env.outputs.image_tag }}"
            export FRONTEND_IMAGE="${{ env.FRONTEND_IMAGE }}:${{ needs.resolve-env.outputs.image_tag }}"
            bash /opt/clarive/scripts/deploy.sh production

      - name: Notify Slack (production deployed)
        if: always() && vars.SLACK_NOTIFY == 'true'
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "${{ job.status == 'success' && '🚀' || '🔥' }} *Production deployed* — `${{ needs.resolve-env.outputs.image_tag }}` by @${{ github.actor }}",
              "blocks": [{
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "${{ job.status == 'success' && '🚀' || '🔥' }} *Clarive PSA — Production* deployed `${{ needs.resolve-env.outputs.image_tag }}`\nTriggered by: @${{ github.actor }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
                }
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

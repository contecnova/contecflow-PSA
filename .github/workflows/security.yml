# ══════════════════════════════════════════════════════════════════════════════
# Clarive PSA — Security Scanning
#
# Runs on:
#   - Every push to main / develop
#   - Every PR targeting main / develop
#   - Weekly schedule (Friday 03:00 UTC) for proactive supply-chain checks
#
# Jobs:
#   gitleaks        — Secret detection in git history
#   pip-audit       — Python dependency vulnerability scan (OSV / PyPI Advisory)
#   validate-exceptions — Ensure no expired vulnerability exceptions are present
#   codeql          — GitHub CodeQL SAST (Python + JavaScript)
# ══════════════════════════════════════════════════════════════════════════════

name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 3 * * 5"   # Every Friday at 03:00 UTC
  workflow_dispatch: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

# ── Jobs ───────────────────────────────────────────────────────────────────────

jobs:

  # ── 1. Secret detection (gitleaks) ─────────────────────────────────────────
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history for thorough scanning

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}   # Optional: Pro/Enterprise license
        with:
          config-path: .gitleaks.toml

  # ── 2. Python dependency audit (pip-audit) ──────────────────────────────────
  pip-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Compute exception flags
        id: exceptions
        run: |
          FLAGS=$(python scripts/get_pip_audit_ignores.py)
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"
          echo "Active ignore flags: $FLAGS"

      - name: Run pip-audit
        run: |
          pip-audit -r requirements.txt \
            --format=json \
            --output=pip-audit-results.json \
            ${{ steps.exceptions.outputs.flags }} \
            || true   # capture non-zero exit for artifact, fail below

          # Exit non-zero if any unexcepted vulns found (without --ignore-vuln flags)
          pip-audit -r requirements.txt \
            --format=columns \
            ${{ steps.exceptions.outputs.flags }}

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-results
          path: pip-audit-results.json
          retention-days: 30

  # ── 3. Validate vulnerability exceptions ────────────────────────────────────
  validate-exceptions:
    name: Validate exception registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check no expired exceptions
        run: python scripts/validate_vulnerability_exceptions.py

  # ── 4. CodeQL SAST (Python + JavaScript) ───────────────────────────────────
  codeql:
    name: CodeQL SAST (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Extra security queries for better coverage
          queries: security-and-quality

      # ── Python: no build step needed ────────────────────────────────────────
      # ── JavaScript: auto-build is sufficient for Vite/React ─────────────────
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          upload: true

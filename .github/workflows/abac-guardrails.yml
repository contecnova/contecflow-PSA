name: ABAC Guardrails

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  abac-and-tenant-guards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ABAC registry completeness
        run: |
          python -m pytest tests/test_abac_registry_completeness.py -q

      # Auditoría 2026-07: toda ruta /api debe declarar auth como DEPENDENCIA.
      # Autenticar dentro del handler la hace invisible al tooling y fue la causa
      # raíz de dos IDOR de portal. Ver docs/AUDIT_2026_07_FULL.md §1.3.
      - name: Route auth coverage (authz declarativa)
        run: |
          python -m pytest tests/test_route_auth_coverage.py -q

      - name: Tenant isolation invoice tests
        run: |
          python -m pytest tests/test_invoice_tenant_isolation.py -q

      - name: Tenant isolation portal tickets (CSAT + comentarios)
        run: |
          python -m pytest tests/test_portal_ticket_tenant_isolation.py -q

      - name: Jira secret encryption test
        run: |
          python -m pytest tests/test_jira_secret_encryption.py -q

      - name: Tenant static audit (strict)
        run: |
          python scripts/audit_tenant_isolation.py --strict --baseline scripts/tenant_audit_baseline.txt

      - name: Secrets encryption audit
        run: |
          python scripts/audit_secrets_encryption.py

      # Auditoría 2026-07 §1.4: antes no había ningún linter de seguridad.
      # ruff.toml ya incluye S (bandit) y B (bugbear).
      - name: Lint (incluye reglas de seguridad S/B)
        run: |
          pip install ruff
          ruff check app tests

      # Auditoría 2026-07 §7: las 117 dependencias están pineadas, lo cual es bueno
      # para reproducibilidad y malo para parcheo — un pin no se actualiza solo.
      # Este paso es el que avisa de CVEs conocidos.
      - name: Dependency vulnerability scan
        run: |
          pip install pip-audit
          pip-audit --requirement requirements.txt --strict

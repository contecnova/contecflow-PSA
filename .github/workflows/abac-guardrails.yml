name: ABAC Guardrails

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  abac-and-tenant-guards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ABAC registry completeness
        run: |
          python -m pytest tests/test_abac_registry_completeness.py -q

      # Auditoría 2026-07: toda ruta /api debe declarar auth como DEPENDENCIA.
      # Autenticar dentro del handler la hace invisible al tooling y fue la causa
      # raíz de dos IDOR de portal. Ver docs/AUDIT_2026_07_FULL.md §1.3.
      - name: Route auth coverage (authz declarativa)
        run: |
          python -m pytest tests/test_route_auth_coverage.py -q

      - name: Tenant isolation invoice tests
        run: |
          python -m pytest tests/test_invoice_tenant_isolation.py -q

      - name: Tenant isolation portal tickets (CSAT + comentarios)
        run: |
          python -m pytest tests/test_portal_ticket_tenant_isolation.py -q

      - name: Tenant isolation portal wiki
        run: |
          python -m pytest tests/test_portal_wiki_tenant_isolation.py -q

      # Auditoría 2026-08 §1: declarar el principal del portal y no usarlo es la
      # firma exacta de los tres IDOR encontrados. Autenticar no acota.
      - name: Portal principal is actually used
        run: |
          python -m pytest tests/test_portal_principal_is_used.py -q

      - name: Jira secret encryption test
        run: |
          python -m pytest tests/test_jira_secret_encryption.py -q

      # DEUDA CONOCIDA — no bloqueante temporalmente (auditoría 2026-08 §3).
      # Este paso lleva fallando desde que el baseline se congeló el 2026-05-17:
      # >=200 hallazgos nuevos (el script trunca en 200, así que el total real se
      # desconoce). Se deja informativo para que el resto de CI dé señal útil, en
      # vez de estar rojo permanentemente y que se acabe ignorando entero.
      # QUITAR continue-on-error al cerrar P1 #6 (triar + regenerar baseline).
      - name: Tenant static audit (strict)
        continue-on-error: true
        run: |
          python scripts/audit_tenant_isolation.py --strict --baseline scripts/tenant_audit_baseline.txt

      - name: Secrets encryption audit
        run: |
          python scripts/audit_secrets_encryption.py

      # Auditoría 2026-07 §1.4: antes no había ningún linter de seguridad.
      # ruff.toml ya incluye S (bandit) y B (bugbear).
      - name: Lint (incluye reglas de seguridad S/B)
        run: |
          pip install ruff
          ruff check app tests

      # Auditoría 2026-07 §7: las 117 dependencias están pineadas, lo cual es bueno
      # para reproducibilidad y malo para parcheo — un pin no se actualiza solo.
      # Este paso es el que avisa de CVEs conocidos.
      # DEUDA CONOCIDA — no bloqueante temporalmente (auditoría 2026-08 §4).
      # Hay 40 CVEs conocidos, 27 solo en pypdf 6.1.3 (que parsea PDFs subidos por
      # usuarios). El informe sale en el log para poder seguirlo.
      # QUITAR continue-on-error al cerrar P1 #4 y #5 (actualizar pypdf y axios, y
      # decidir por escrito sobre ecdsa, que no tiene versión con arreglo).
      - name: Dependency vulnerability scan
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit --requirement requirements.txt --strict

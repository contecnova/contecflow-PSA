name: ABAC Guardrails

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  abac-and-tenant-guards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ABAC registry completeness
        run: |
          python -m pytest tests/test_abac_registry_completeness.py -q

      - name: Tenant isolation invoice tests
        run: |
          python -m pytest tests/test_invoice_tenant_isolation.py -q

      - name: Jira secret encryption test
        run: |
          python -m pytest tests/test_jira_secret_encryption.py -q

      - name: Tenant static audit (strict)
        run: |
          python scripts/audit_tenant_isolation.py --strict --baseline scripts/tenant_audit_baseline.txt

      - name: Secrets encryption audit
        run: |
          python scripts/audit_secrets_encryption.py

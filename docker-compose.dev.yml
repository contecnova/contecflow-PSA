# Contecflow PSA — Infraestructura de desarrollo local
#
# Levanta Postgres + Redis para desarrollo. La aplicación corre fuera de
# Docker (uvicorn local), que es el patrón que permite iterar rápido sin
# reconstruir imágenes.
#
# El setup.sh lo gestiona automáticamente:
#   - Si Docker está disponible, lo levanta y apunta DATABASE_URL / REDIS_URL
#     a estos contenedores.
#   - Si Docker no está disponible, usa SQLite como fallback.
#
# Uso manual:
#   docker compose -f docker-compose.dev.yml up -d        # arrancar
#   docker compose -f docker-compose.dev.yml ps           # estado
#   docker compose -f docker-compose.dev.yml down         # parar (conserva datos)
#   docker compose -f docker-compose.dev.yml down -v      # parar + borrar volúmenes
#
# Variables de entorno (sobreescribibles via .env o export antes del compose):
#   POSTGRES_USER      (default: contecflow)
#   POSTGRES_PASSWORD  (default: contecflow_dev)
#   POSTGRES_DB        (default: contecflow)
#   POSTGRES_PORT      (default: 127.0.0.1:5434)  ← 5434 to avoid clash with Contecmind on 5432
#   REDIS_PORT         (default: 127.0.0.1:6381)  ← 6381 to avoid clash with Contecmind on 6379

services:
  postgres:
    image: postgres:16-alpine
    container_name: contecflow-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contecflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contecflow_dev}
      POSTGRES_DB: ${POSTGRES_DB:-contecflow}
      # UTF-8 explícito: evita errores en ORDER BY con texto con acentos
      # en algunas plataformas (Alpine en Apple Silicon).
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=en_US.utf8 --lc-ctype=en_US.utf8"
    volumes:
      - contecflow_postgres_dev:/var/lib/postgresql/data
    ports:
      # Bind a loopback: no exponer Postgres a la red local.
      # Puerto 5434 (no 5432) para evitar conflicto con Contecmind u otros servicios.
      - "${POSTGRES_PORT:-127.0.0.1:5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-contecflow} -d ${POSTGRES_DB:-contecflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: contecflow-redis-dev
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      # Evita que Redis llene la RAM si hay un leak de claves.
      - --maxmemory
      - "256mb"
      - --maxmemory-policy
      - "allkeys-lru"
    volumes:
      - contecflow_redis_dev:/data
    ports:
      # Puerto 6381 (no 6379) para evitar conflicto con Contecmind u otros servicios.
      - "${REDIS_PORT:-127.0.0.1:6381}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  contecflow_postgres_dev:
  contecflow_redis_dev:
